services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chasqui-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chasqui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chasqui_secret}
      POSTGRES_DB: ${POSTGRES_DB:-chasqui}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - chasqui_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chasqui} -d ${POSTGRES_DB:-chasqui}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chasqui_pgdata:
